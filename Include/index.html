<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="UniBridge：文藻外語大學國際學生專屬的多語言 LINE AI 小幫手 / Multilingual LINE AI helper for Wenzao international students"
    />
    <title>UniBridge｜文藻國際學生 AI 小幫手</title>
    <style>
      :root {
        --bg: #f4f8f5;
        --card: #fff;
        --text: #12211a;
        --muted: #587064;
        --line: #06c755;
        --line2: #04a846;
        --soft: #e3f5ea;
        --border: #d8e5dd;
        --shadow: 0 10px 30px rgba(10, 40, 25, 0.08);
        --ink: #fff;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0c1410;
          --card: #15201a;
          --text: #e8f1ec;
          --muted: #93a69b;
          --soft: #1b2f24;
          --border: #26372d;
          --shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }
      }
      :root[data-theme="dark"] {
        --bg: #0c1410;
        --card: #15201a;
        --text: #e8f1ec;
        --muted: #93a69b;
        --soft: #1b2f24;
        --border: #26372d;
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
        scroll-padding-top: 72px;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family:
          system-ui,
          -apple-system,
          "Noto Sans TC",
          "Noto Sans Thai",
          "Noto Sans Arabic",
          "PingFang TC",
          "Microsoft JhengHei",
          sans-serif;
        line-height: 1.7;
      }
      a {
        color: inherit;
      }
      :focus-visible {
        outline: 3px solid var(--line);
        outline-offset: 2px;
      }
      .wrap {
        max-width: 1080px;
        margin: 0 auto;
        padding: 0 18px;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 10;
        background: color-mix(in srgb, var(--bg) 88%, transparent);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--border);
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 14px;
        height: 60px;
      }
      .brand {
        font-weight: 800;
        font-size: 21px;
        text-decoration: none;
        margin-inline-end: auto;
      }
      .brand b {
        color: var(--line);
      }
      nav {
        display: flex;
        gap: 6px;
      }
      nav a {
        text-decoration: none;
        color: var(--muted);
        font-size: 15px;
        padding: 4px 10px;
        border-radius: 999px;
      }
      nav a:hover,
      nav a.on {
        color: var(--text);
        background: var(--soft);
      }
      select,
      .tbtn {
        background: var(--card);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 6px 10px;
        font-size: 14px;
        cursor: pointer;
        max-width: 150px;
      }
      @media (max-width: 760px) {
        nav {
          display: none;
        }
      }

      .hero {
        padding: 54px 0 28px;
      }
      .hg {
        display: grid;
        grid-template-columns: 1.15fr 1fr;
        gap: 36px;
        align-items: center;
      }
      @media (max-width: 820px) {
        .hg {
          grid-template-columns: 1fr;
        }
      }
      h1 {
        font-size: clamp(30px, 5.6vw, 50px);
        line-height: 1.2;
        margin: 0 0 16px;
        letter-spacing: 0.3px;
      }
      h1 em {
        font-style: normal;
        background: linear-gradient(transparent 62%, var(--soft) 62%);
      }
      .sub {
        color: var(--muted);
        font-size: 17px;
        max-width: 560px;
        margin: 0 0 24px;
      }
      .acts {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        align-items: center;
      }
      .cta {
        display: inline-block;
        background: var(--line);
        color: #fff;
        text-decoration: none;
        font-weight: 700;
        padding: 14px 30px;
        border-radius: 999px;
        font-size: 18px;
        box-shadow: 0 6px 18px rgba(6, 199, 85, 0.35);
        transition: 0.15s;
      }
      .cta:hover {
        background: var(--line2);
        transform: translateY(-2px);
      }
      .copy {
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--text);
        border-radius: 999px;
        padding: 12px 18px;
        font-size: 15px;
        cursor: pointer;
      }
      .badges {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 22px 0 0;
        padding: 0;
        list-style: none;
      }
      .badge {
        background: var(--soft);
        border-radius: 999px;
        padding: 5px 14px;
        font-size: 14px;
      }
      .qrbox {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-top: 22px;
        color: var(--muted);
        font-size: 14px;
      }
      #qr {
        width: 104px;
        height: 104px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: #fff;
        padding: 5px;
      }

      /* hero chat: the one memorable element */
      .chat {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 26px;
        padding: 18px;
        box-shadow: var(--shadow);
        min-height: 330px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .chat-h {
        display: flex;
        align-items: center;
        gap: 10px;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--border);
        font-weight: 700;
      }
      .dot {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: var(--line);
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 16px;
      }
      .chat-h small {
        display: block;
        font-weight: 400;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.2;
      }
      .msg {
        max-width: 86%;
        padding: 9px 14px;
        border-radius: 16px;
        animation: pop 0.3s ease;
        font-size: 15px;
      }
      .me {
        align-self: flex-end;
        background: var(--line);
        color: #fff;
        border-bottom-right-radius: 4px;
      }
      .bot {
        align-self: flex-start;
        background: var(--soft);
        border-bottom-left-radius: 4px;
      }
      [dir="rtl"] .me {
        border-bottom-right-radius: 16px;
        border-bottom-left-radius: 4px;
      }
      [dir="rtl"] .bot {
        border-bottom-left-radius: 16px;
        border-bottom-right-radius: 4px;
      }
      .msg small {
        display: block;
        opacity: 0.7;
        font-size: 12px;
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      /* language strip */
      .langs {
        border-block: 1px solid var(--border);
        background: var(--card);
        overflow: hidden;
        padding: 14px 0;
        margin-top: 30px;
      }
      .track {
        display: flex;
        gap: 12px;
        width: max-content;
        animation: slide 60s linear infinite;
      }
      .langs:hover .track {
        animation-play-state: paused;
      }
      .track span {
        white-space: nowrap;
        background: var(--soft);
        padding: 6px 16px;
        border-radius: 999px;
        font-size: 15px;
      }
      @keyframes slide {
        to {
          transform: translateX(-50%);
        }
      }
      .lnote {
        text-align: center;
        color: var(--muted);
        font-size: 14px;
        margin: 10px 0 0;
      }

      section {
        padding: 48px 0;
      }
      h2 {
        font-size: 28px;
        margin: 0 0 26px;
        text-align: center;
      }
      h2::after {
        content: "";
        display: block;
        width: 44px;
        height: 4px;
        border-radius: 4px;
        background: var(--line);
        margin: 10px auto 0;
      }
      .feats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 0 28px;
      }
      .f {
        display: flex;
        gap: 14px;
        padding: 18px 4px;
        border-bottom: 1px solid var(--border);
      }
      .f .ic {
        font-size: 28px;
        line-height: 1.2;
      }
      .f h3 {
        margin: 0 0 2px;
        font-size: 18px;
      }
      .f p {
        margin: 0;
        color: var(--muted);
        font-size: 15px;
      }
      .steps {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 18px;
        counter-reset: s;
      }
      .step {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 22px;
        box-shadow: var(--shadow);
      }
      .step .n {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: var(--line);
        color: #fff;
        font-weight: 800;
        display: grid;
        place-items: center;
        margin-bottom: 10px;
      }
      .step h3 {
        margin: 0 0 4px;
        font-size: 18px;
      }
      .step p {
        margin: 0;
        color: var(--muted);
        font-size: 15px;
      }
      .demo {
        display: grid;
        grid-template-columns: 1fr 1.3fr;
        gap: 18px;
        align-items: start;
      }
      @media (max-width: 760px) {
        .demo {
          grid-template-columns: 1fr;
        }
      }
      .tabs {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .tab {
        text-align: start;
        background: var(--card);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 12px 16px;
        font-size: 16px;
        cursor: pointer;
      }
      .tab.on {
        border-color: var(--line);
        background: var(--soft);
        font-weight: 700;
      }
      #phone {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 22px;
        padding: 16px;
        min-height: 220px;
        box-shadow: var(--shadow);
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      details {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 14px 18px;
        margin-bottom: 10px;
      }
      summary {
        cursor: pointer;
        font-weight: 700;
        font-size: 17px;
      }
      details p {
        margin: 10px 0 0;
        color: var(--muted);
      }
      .map {
        text-align: center;
      }
      .map img {
        max-width: 100%;
        border-radius: 16px;
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
      }
      .map p {
        color: var(--muted);
      }
      .btn2 {
        display: inline-block;
        margin-top: 14px;
        border: 2px solid var(--line);
        color: var(--line);
        text-decoration: none;
        font-weight: 700;
        padding: 10px 24px;
        border-radius: 999px;
      }
      .btn2:hover {
        background: var(--line);
        color: #fff;
      }
      footer {
        border-top: 1px solid var(--border);
        padding: 28px 0 40px;
        text-align: center;
        color: var(--muted);
        font-size: 14px;
      }
      .rv {
        opacity: 0;
        transform: translateY(14px);
        transition: 0.5s;
      }
      .rv.in {
        opacity: 1;
        transform: none;
      }
      @media (prefers-reduced-motion: reduce) {
        .rv {
          opacity: 1;
          transform: none;
          transition: none;
        }
        html {
          scroll-behavior: auto;
        }
        .track {
          animation: none;
          flex-wrap: wrap;
          width: auto;
          justify-content: center;
        }
        .msg {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="wrap bar">
        <a class="brand" href="#top">Uni<b>Bridge</b></a>
        <nav id="nav"></nav>
        <select id="lang" aria-label="Language">
          <option value="zh">繁體中文</option>
          <option value="en">English</option>
          <option value="vi">Tiếng Việt</option>
          <option value="id">Bahasa Indonesia</option>
          <option value="ms">Bahasa Melayu</option>
          <option value="fil">Filipino</option>
          <option value="th">ไทย</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
          <option value="es">Español</option>
          <option value="ar">العربية</option>
        </select>
        <button class="tbtn" id="theme" aria-label="Theme">🌓</button>
      </div>
    </header>

    <main id="top">
      <div class="hero">
        <div class="wrap hg">
          <div>
            <h1 id="tag"></h1>
            <p class="sub" id="sub"></p>
            <div class="acts">
              <a class="cta" id="cta" target="_blank" rel="noopener"></a>
              <button class="copy" id="copy"></button>
            </div>
            <ul class="badges" id="badges"></ul>
            <div class="qrbox">
              <img
                id="qr"
                src="line-qr.png"
                alt="LINE QR Code"
                onerror="this.parentNode.style.display = 'none'"
              />
              <span id="scan"></span>
            </div>
          </div>
          <div class="chat" aria-hidden="true">
            <div class="chat-h">
              <span class="dot">U</span>
              <div>UniBridge<small id="online"></small></div>
            </div>
            <div
              id="hchat"
              style="display: flex; flex-direction: column; gap: 10px"
            ></div>
          </div>
        </div>
      </div>

      <div class="langs" aria-label="Languages">
        <div class="track" id="track"></div>
      </div>
      <p class="lnote wrap" id="lnote"></p>

      <section id="features">
        <div class="wrap rv">
          <h2 id="hf"></h2>
          <div class="feats" id="feats"></div>
        </div>
      </section>
      <section id="how">
        <div class="wrap rv">
          <h2 id="hh"></h2>
          <div class="steps" id="steps"></div>
        </div>
      </section>
      <section id="demo">
        <div class="wrap rv">
          <h2 id="hd"></h2>
          <div class="demo">
            <div class="tabs" id="tabs"></div>
            <div id="phone" aria-live="polite"></div>
          </div>
        </div>
      </section>
      <section id="faq">
        <div class="wrap rv" style="max-width: 760px">
          <h2 id="hq"></h2>
          <div id="faqs"></div>
        </div>
      </section>
      <section id="map">
        <div class="wrap rv map">
          <h2 id="hm"></h2>
          <p id="md"></p>
          <a id="mapimg" target="_blank" rel="noopener"
            ><img
              id="mapthumb"
              loading="lazy"
              alt="Campus map"
              onerror="this.style.display = 'none'" /></a
          ><br />
          <a class="btn2" id="mb" target="_blank" rel="noopener"></a>
        </div>
      </section>
    </main>

    <footer>
      <div class="wrap">
        <p id="note"></p>
        <p>
          <a
            href="https://www.wzu.edu.tw/"
            target="_blank"
            rel="noopener"
            id="school"
          ></a>
          · © UniBridge
        </p>
      </div>
    </footer>

      const $ = (id) => document.getElementById(id);

        return e;

        demoIdx = 0,

      function showDemo(t, i) {
        clearTimeout(timer);
        demoIdx = i;
        [...$("tabs").children].forEach((b, k) =>
          b.classList.toggle("on", k === i),
        );
        const ph = $("phone");
        ph.replaceChildren(el("div", "msg me", t.demo[i][0]));
        timer = setTimeout(
          () => ph.append(el("div", "msg bot", t.demo[i][1])),
          600,
        );
      }
      function hello() {
        clearTimeout(helloTimer);
        const h = HELLO[hi % HELLO.length],
          box = $("hchat"),
          m = el("div", "msg me");
        box.replaceChildren(m);
        m.append(el("small", "", h[0]), document.createTextNode(h[1]));
        helloTimer = setTimeout(() => {
          box.append(el("div", "msg bot", h[2]));
          helloTimer = setTimeout(() => {
            hi++;
            hello();
          }, 2600);
        }, 900);
      }
      function render(code) {
        const t = Object.assign({}, T.en, T[code]);

        root.dir = T[code].dir || "ltr";

          "UniBridge｜" +
          (code === "zh" ? "文藻國際學生 AI 小幫手" : "Wenzao AI Helper");

        [
          "sub",
          "scan",
          "hf",

          "hd",
          "hq",
          "hm",
          "md",
          "mb",
          "note",
          "school",
          "lnote",
          "online",
        ].forEach((k) => ($(k).textContent = t[k]));
        $("cta").textContent = t.cta;
        $("cta").href = ADD_URL;

          try {
            await navigator.clipboard.writeText(LINE_ID);
          } catch (e) {}
          const b = $("copy");
          b.textContent = t.copied;
          setTimeout(() => (b.textContent = t.copy), 1800);

          ...t.badges.map((b) => el("li", "badge", b)),
        );
        const ids = ["#features", "#how", "#faq", "#map"];
        $("nav").replaceChildren(
          ...t.nav.map((n, i) => {
            const a = el("a", "", n);
            a.href = ids[i];
            return a;
          }),
        );
        $("feats").replaceChildren(

            d.append(el("h3", "", x), el("p", "", t.fd[i]));
            c.append(el("span", "ic", ICONS[i]), d);
            return c;
          }),
        );

          ...t.st.map((s, i) => {
            const c = el("div", "step");

              el("div", "n", i + 1),
              el("h3", "", s[0]),
              el("p", "", s[1]),
            );

          }),
        );
        $("faqs").replaceChildren(
          ...t.q.map((q) => {

        const r = document.documentElement,
          dark = r.dataset.theme
            ? r.dataset.theme === "dark"
            : matchMedia("(prefers-color-scheme:dark)").matches;
        r.dataset.theme = dark ? "light" : "dark";
      };
      render(sel.value);
      hello();

      const io = new IntersectionObserver(
        (es) =>
          es.forEach((e) => {
            if (e.isIntersecting) {
              e.target.classList.add("in");
              io.unobserve(e.target);
            }
          }),
        { threshold: 0.12 },
      );
      document.querySelectorAll(".rv").forEach((n) => io.observe(n));
      // highlight current section in nav
      const secs = ["features", "how", "faq", "map"].map((i) => $(i));
      const so = new IntersectionObserver(
        (es) =>
          es.forEach((e) => {
            if (e.isIntersecting) {
              const i = secs.indexOf(e.target);
              [...$("nav").children].forEach((a, k) =>
                a.classList.toggle("on", k === i),
              );
            }
          }),
        { rootMargin: "-40% 0px -55% 0px" },
      );
      secs.forEach((s) => so.observe(s));
    </script>
  </body>
</html>
