<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="UniBridge：文藻外語大學國際學生專屬的多語言 LINE AI 小幫手 / Multilingual LINE AI helper for Wenzao international students"
    />
    <meta name="theme-color" content="#06c755" />
    <meta property="og:title" content="UniBridge｜Wenzao AI Helper" />
    <meta
      property="og:description"
      content="Multilingual LINE AI helper for Wenzao international students"
    />
    <meta property="og:type" content="website" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%89%3C/text%3E%3C/svg%3E"
    />
    <title>UniBridge｜文藻國際學生 AI 小幫手</title>
    <style>
      :root {
        --bg: #f4f8f5;
        --card: #fff;
        --text: #12211a;
        --muted: #587064;
        --line: #06c755;
        --line2: #04a846;
        --soft: #e3f5ea;
        --border: #d8e5dd;
        --shadow: 0 10px 30px rgba(10, 40, 25, 0.08);
        --ink: #fff;
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0c1410;
          --card: #15201a;
          --text: #e8f1ec;
          --muted: #93a69b;
          --soft: #1b2f24;
          --border: #26372d;
          --shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }
      }

      :root[data-theme="dark"] {
        --bg: #0c1410;
        --card: #15201a;
        --text: #e8f1ec;
        --muted: #93a69b;
        --soft: #1b2f24;
        --border: #26372d;
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      }

      * { box-sizing: border-box; }
      html {
        scroll-behavior: smooth;
        scroll-padding-top: 72px;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, "Noto Sans TC", "Noto Sans Thai",
          "Noto Sans Arabic", "PingFang TC", "Microsoft JhengHei", sans-serif;
        line-height: 1.7;
      }
      a { color: inherit; }
      :focus-visible {
        outline: 3px solid var(--line);
        outline-offset: 2px;
      }
      .wrap {
        max-width: 1080px;
        margin: 0 auto;
        padding: 0 18px;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 10;
        background: rgba(244, 248, 245, 0.88);
        border-bottom: 1px solid var(--border);
        backdrop-filter: blur(10px);
      }
      :root[data-theme="dark"] header {
        background: rgba(12, 20, 16, 0.9);
      }
      @supports (background: color-mix(in srgb, var(--bg) 88%, transparent)) {
        header {
          background: color-mix(in srgb, var(--bg) 88%, transparent);
        }
      }

      .bar {
        display: flex;
        align-items: center;
        gap: 14px;
        height: 60px;
      }
      .brand {
        font-weight: 800;
        font-size: 21px;
        text-decoration: none;
        margin-inline-end: auto;
      }
      .brand b { color: var(--line); }
      nav {
        display: flex;
        gap: 6px;
      }
      nav a {
        text-decoration: none;
        color: var(--muted);
        font-size: 15px;
        padding: 4px 10px;
        border-radius: 999px;
      }
      nav a:hover,
      nav a.on {
        color: var(--text);
        background: var(--soft);
      }
      select,
      .tbtn {
        background: var(--card);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 6px 10px;
        font-size: 14px;
        cursor: pointer;
        max-width: 150px;
      }
      @media (max-width: 760px) {
        nav { display: none; }
      }

      .hero {
        padding: 54px 0 28px;
        background: radial-gradient(700px 300px at 88% -40px, var(--soft), transparent),
          radial-gradient(520px 240px at 0 0, rgba(6, 199, 85, 0.08), transparent);
      }
      .hg {
        display: grid;
        grid-template-columns: 1.15fr 1fr;
        gap: 36px;
        align-items: center;
      }
      @media (max-width: 820px) {
        .hg { grid-template-columns: 1fr; }
      }
      h1 {
        font-size: clamp(30px, 5.6vw, 50px);
        line-height: 1.2;
        margin: 0 0 16px;
        letter-spacing: 0.3px;
      }
      h1 em {
        font-style: normal;
        background: linear-gradient(transparent 62%, var(--soft) 62%);
      }
      .sub {
        color: var(--muted);
        font-size: 17px;
        max-width: 560px;
        margin: 0 0 24px;
      }
      .acts {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        align-items: center;
      }
      .cta {
        display: inline-block;
        background: var(--line);
        color: #fff;
        text-decoration: none;
        font-weight: 700;
        padding: 14px 30px;
        border-radius: 999px;
        font-size: 18px;
        box-shadow: 0 6px 18px rgba(6, 199, 85, 0.35);
        transition: 0.15s;
      }
      .cta:hover {
        background: var(--line2);
        transform: translateY(-2px);
      }
      .copy {
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--text);
        border-radius: 999px;
        padding: 12px 18px;
        font-size: 15px;
        cursor: pointer;
      }
      .badges {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 22px 0 0;
        padding: 0;
        list-style: none;
      }
      .badge {
        background: var(--soft);
        border-radius: 999px;
        padding: 5px 14px;
        font-size: 14px;
      }
      .qrbox {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-top: 22px;
        color: var(--muted);
        font-size: 14px;
      }
      #qr {
        width: 104px;
        height: 104px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: #fff;
        padding: 5px;
      }

      .chat {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 26px;
        padding: 18px;
        box-shadow: var(--shadow);
        min-height: 330px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .chat-h {
        display: flex;
        align-items: center;
        gap: 10px;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--border);
        font-weight: 700;
      }
      .dot {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: var(--line);
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 16px;
      }
      .chat-h small {
        display: block;
        font-weight: 400;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.2;
      }
      .msg {
        max-width: 86%;
        padding: 9px 14px;
        border-radius: 16px;
        animation: pop 0.3s ease;
        font-size: 15px;
      }
      .me {
        align-self: flex-end;
        background: var(--line);
        color: #fff;
        border-bottom-right-radius: 4px;
      }
      .bot {
        align-self: flex-start;
        background: var(--soft);
        border-bottom-left-radius: 4px;
      }
      [dir="rtl"] .me {
        border-bottom-right-radius: 16px;
        border-bottom-left-radius: 4px;
      }
      [dir="rtl"] .bot {
        border-bottom-left-radius: 16px;
        border-bottom-right-radius: 4px;
      }
      .msg small {
        display: block;
        opacity: 0.7;
        font-size: 12px;
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      .langs {
        border-block: 1px solid var(--border);
        background: var(--card);
        overflow: hidden;
        padding: 14px 0;
        margin-top: 30px;
      }
      .track {
        display: flex;
        gap: 12px;
        width: max-content;
        animation: slide 60s linear infinite;
      }
      .langs:hover .track {
        animation-play-state: paused;
      }
      .track span {
        white-space: nowrap;
        background: var(--soft);
        padding: 6px 16px;
        border-radius: 999px;
        font-size: 15px;
      }
      @keyframes slide {
        to { transform: translateX(-50%); }
      }
      .lnote {
        text-align: center;
        color: var(--muted);
        font-size: 14px;
        margin: 10px 0 0;
      }

      section {
        padding: 48px 0;
      }
      h2 {
        font-size: 28px;
        margin: 0 0 26px;
        text-align: center;
      }
      h2::after {
        content: "";
        display: block;
        width: 44px;
        height: 4px;
        border-radius: 4px;
        background: var(--line);
        margin: 10px auto 0;
      }
      .feats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 0 28px;
      }
      .f {
        display: flex;
        gap: 14px;
        padding: 18px 4px;
        border-bottom: 1px solid var(--border);
      }
      .f .ic {
        font-size: 28px;
        line-height: 1.2;
      }
      .f h3 {
        margin: 0 0 2px;
        font-size: 18px;
      }
      .f p {
        margin: 0;
        color: var(--muted);
        font-size: 15px;
      }
      .steps {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 18px;
      }
      .step {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 22px;
        box-shadow: var(--shadow);
      }
      .step .n {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: var(--line);
        color: #fff;
        font-weight: 800;
        display: grid;
        place-items: center;
        margin-bottom: 10px;
      }
      .step h3 {
        margin: 0 0 4px;
        font-size: 18px;
      }
      .step p {
        margin: 0;
        color: var(--muted);
        font-size: 15px;
      }
      .demo {
        display: grid;
        grid-template-columns: 1fr 1.3fr;
        gap: 18px;
        align-items: start;
      }
      @media (max-width: 760px) {
        .demo { grid-template-columns: 1fr; }
      }
      .tabs {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .tab {
        text-align: start;
        background: var(--card);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 12px 16px;
        font-size: 16px;
        cursor: pointer;
      }
      .tab.on {
        border-color: var(--line);
        background: var(--soft);
        font-weight: 700;
      }
      #phone {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 22px;
        padding: 16px;
        min-height: 220px;
        box-shadow: var(--shadow);
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      details {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 14px 18px;
        margin-bottom: 10px;
      }
      summary {
        cursor: pointer;
        font-weight: 700;
        font-size: 17px;
      }
      details p {
        margin: 10px 0 0;
        color: var(--muted);
      }
      .map {
        text-align: center;
      }
      .map img {
        max-width: 100%;
        border-radius: 16px;
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
      }
      .map p {
        color: var(--muted);
      }
      .btn2 {
        display: inline-block;
        margin-top: 14px;
        border: 2px solid var(--line);
        color: var(--line);
        text-decoration: none;
        font-weight: 700;
        padding: 10px 24px;
        border-radius: 999px;
      }
      .btn2:hover {
        background: var(--line);
        color: #fff;
      }
      footer {
        border-top: 1px solid var(--border);
        padding: 28px 0 40px;
        text-align: center;
        color: var(--muted);
        font-size: 14px;
      }
      .rv {
        opacity: 0;
        transform: translateY(14px);
        transition: 0.5s;
      }
      .rv.in {
        opacity: 1;
        transform: none;
      }
      @media (prefers-reduced-motion: reduce) {
        .rv {
          opacity: 1;
          transform: none;
          transition: none;
        }
        html {
          scroll-behavior: auto;
        }
        .track {
          animation: none;
          flex-wrap: wrap;
          width: auto;
          justify-content: center;
        }
        .msg {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="wrap bar">
        <a class="brand" href="#top">Uni<b>Bridge</b></a>
        <nav id="nav"></nav>
        <select id="lang" aria-label="Language">
          <option value="zh">繁體中文</option>
          <option value="en">English</option>
          <option value="vi">Tiếng Việt</option>
          <option value="id">Bahasa Indonesia</option>
          <option value="ms">Bahasa Melayu</option>
          <option value="fil">Filipino</option>
          <option value="th">ไทย</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
          <option value="es">Español</option>
          <option value="ar">العربية</option>
        </select>
        <button class="tbtn" id="theme" aria-label="Theme">🌓</button>
      </div>
    </header>

    <main id="top">
      <div class="hero">
        <div class="wrap hg">
          <div>
            <h1 id="tag"></h1>
            <p class="sub" id="sub"></p>
            <div class="acts">
              <a class="cta" id="cta" target="_blank" rel="noopener"></a>
              <button class="copy" id="copy" type="button"></button>
            </div>
            <ul class="badges" id="badges"></ul>
            <div class="qrbox">
              <img id="qr" src="line-qr.png" alt="LINE QR Code" onerror="this.parentNode.style.display='none'" />
              <span id="scan"></span>
            </div>
          </div>
          <div class="chat" aria-hidden="true">
            <div class="chat-h">
              <span class="dot">U</span>
              <div>
                UniBridge
                <small id="online"></small>
              </div>
            </div>
            <div id="hchat" style="display: flex; flex-direction: column; gap: 10px"></div>
          </div>
        </div>
      </div>

      <div class="langs" aria-label="Languages">
        <div class="track" id="track"></div>
      </div>
      <p class="lnote wrap" id="lnote"></p>

      <section id="features">
        <div class="wrap rv">
          <h2 id="hf"></h2>
          <div class="feats" id="feats"></div>
        </div>
      </section>

      <section id="how">
        <div class="wrap rv">
          <h2 id="hh"></h2>
          <div class="steps" id="steps"></div>
        </div>
      </section>

      <section id="demo">
        <div class="wrap rv">
          <h2 id="hd"></h2>
          <div class="demo">
            <div class="tabs" id="tabs"></div>
            <div id="phone" aria-live="polite"></div>
          </div>
        </div>
      </section>

      <section id="faq">
        <div class="wrap rv" style="max-width: 760px">
          <h2 id="hq"></h2>
          <div id="faqs"></div>
        </div>
      </section>

      <section id="map">
        <div class="wrap rv map">
          <h2 id="hm"></h2>
          <p id="md"></p>
          <a id="mapimg" target="_blank" rel="noopener">
            <img id="mapthumb" loading="lazy" alt="Campus map" onerror="this.style.display='none'" />
          </a>
          <br />
          <a class="btn2" id="mb" target="_blank" rel="noopener"></a>
        </div>
      </section>
    </main>

    <footer>
      <div class="wrap">
        <p id="note"></p>
        <p>
          <a href="https://www.wzu.edu.tw/" target="_blank" rel="noopener" id="school"></a>
          · © UniBridge
        </p>
      </div>
    </footer>

        const safeStorage = {
          get(key, fallback) {
            try {
              const value = localStorage.getItem(key);
              if (value === null) return fallback;
              return JSON.parse(value);
            } catch (error) {
              return fallback;
            }
          },
          set(key, value) {
            try {
              localStorage.setItem(key, JSON.stringify(value));
            } catch (error) {
              // ignore storage errors
            }
          }
        };

        const state = {
          lang: "zh",
          demoIndex: 0,
          helloIndex: 0,
          demoTimer: null,
          helloTimer: null,
          revealObserver: null
        };

        function $(id) {
          return document.getElementById(id);
        }

        function el(tag, className, text) {
          const node = document.createElement(tag);
          if (className) node.className = className;
          if (text !== undefined && text !== null) node.textContent = text;
          return node;
        }

        function getLocaleCode() {
          const language = (navigator.language || "zh").toLowerCase();
          if (T[language]) return language;
          const short = language.split("-")[0];
          if (T[short]) return short;
          if (language.startsWith("tl")) return "fil";
          return "zh";
        }

        function applyTheme(theme) {
          const root = document.documentElement;
          if (theme === "dark") {
            root.setAttribute("data-theme", "dark");
          } else if (theme === "light") {
            root.setAttribute("data-theme", "light");
          } else {
            root.removeAttribute("data-theme");
          }
        }

        function initTheme() {
          const saved = safeStorage.get("ub-theme", null);
          if (saved) {
            applyTheme(saved);
          } else {
            const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
            applyTheme(prefersDark ? "dark" : "light");
          }

          $("theme").addEventListener("click", () => {
            const root = document.documentElement;
            const current = root.getAttribute("data-theme");
            const next = current === "dark" ? "light" : "dark";
            applyTheme(next);
            safeStorage.set("ub-theme", next);
          });
        }

        function initLanguage() {
          const select = $("lang");
          const saved = safeStorage.get("ub-lang", getLocaleCode());
          const language = T[saved] ? saved : getLocaleCode();

          select.value = language;
          state.lang = language;

          select.addEventListener("change", () => {
            state.lang = select.value;
            safeStorage.set("ub-lang", state.lang);
            render();
          });
        }

        function shareTextOrCopy() {
          const payload = {
            title: "UniBridge",
            text: document.title,
            url: location.href.startsWith("http") ? location.href : ADD_URL
          };

          if (navigator.share) {
            navigator.share(payload).catch(() => {});
            return;
          }

          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(payload.url).catch(() => {});
          }
        }

        function initCopyButton() {
          const copyBtn = $("copy");
          copyBtn.addEventListener("click", async () => {
            const original = T[state.lang].copy;
            try {
              if (navigator.clipboard && navigator.clipboard.writeText) {
                await navigator.clipboard.writeText(LINE_ID);
              }
            } catch (error) {
              // no-op fallback
            }
            copyBtn.textContent = T[state.lang].copied;
            setTimeout(() => {
              copyBtn.textContent = original;
            }, 1800);
          });
        }

        function renderHeader() {
          const item = T[state.lang];
          const nav = $("nav");
          nav.innerHTML = "";
          ["#features", "#how", "#faq", "#map"].forEach((href, index) => {
            const a = document.createElement("a");
            a.href = href;
            a.textContent = item.nav[index];
            if (index === 0) a.classList.add("on");
            nav.appendChild(a);
          });
        }

        function renderHero() {
          const item = T[state.lang];
          $("tag").innerHTML = item.tag;
          $("sub").textContent = item.sub;
          $("cta").textContent = item.cta;
          $("cta").href = ADD_URL;
          $("copy").textContent = item.copy;
          $("scan").textContent = item.scan;
          $("online").textContent = item.online;
          $("lnote").textContent = item.lnote;
          $("note").textContent = item.note;
          $("school").textContent = item.school;
          $("school").href = "https://www.wzu.edu.tw/";
          $("mapimg").href = MAP_URL;
          $("mapthumb").src = MAP_URL;
          $("mb").textContent = item.mb;
          $("mb").href = MAP_URL;

          const badges = $("badges");
          badges.innerHTML = "";
          item.badges.forEach((badge) => {
            const li = el("li", "badge", badge);
            badges.appendChild(li);
          });
        }

        function renderFeatures() {
          const item = T[state.lang];
          $("hf").textContent = item.hf;
          const container = $("feats");
          container.innerHTML = "";
          item.ft.forEach((title, index) => {
            const row = el("div", "f");
            const icon = el("span", "ic", ICONS[index]);
            const body = el("div");
            const h3 = el("h3", "", title);
            const p = el("p", "", item.fd[index]);
            body.appendChild(h3);
            body.appendChild(p);
            row.appendChild(icon);
            row.appendChild(body);
            container.appendChild(row);
          });

          $("hh").textContent = item.hh;
          const steps = $("steps");
          steps.innerHTML = "";
          item.st.forEach(([title, text], index) => {
            const step = el("div", "step");
            const n = el("div", "n", String(index + 1));
            const h3 = el("h3", "", title);
            const p = el("p", "", text);
            step.appendChild(n);
            step.appendChild(h3);
            step.appendChild(p);
            steps.appendChild(step);
          });
        }

        function renderDemo() {
          const item = T[state.lang];
          $("hd").textContent = item.hd;
          const tabs = $("tabs");
          const phone = $("phone");
          tabs.innerHTML = "";

          item.demo.forEach(([title, body], index) => {
            const btn = el("button", "tab" + (index === state.demoIndex ? " on" : ""), title);
            btn.type = "button";
            btn.addEventListener("click", () => {
              state.demoIndex = index;
              renderDemo();
            });
            tabs.appendChild(btn);
          });

          const data = item.demo[state.demoIndex];
          phone.innerHTML = "";
          const me = el("div", "msg me", data[0]);
          const bot = el("div", "msg bot", data[1]);
          phone.appendChild(me);
          setTimeout(() => phone.appendChild(bot), 450);
        }

        function renderFaq() {
          const item = T[state.lang];
          $("hq").textContent = item.hq;
          const faq = $("faqs");
          faq.innerHTML = "";
          item.q.forEach(([question, answer]) => {
            const details = document.createElement("details");
            const summary = el("summary", "", question);
            const p = el("p", "", answer);
            details.appendChild(summary);
            details.appendChild(p);
            faq.appendChild(details);
          });
        }

        function renderMap() {
          const item = T[state.lang];
          $("hm").textContent = item.hm;
          $("md").textContent = item.md;
          $("mapimg").href = MAP_URL;
          $("mapthumb").src = MAP_URL;
          $("mb").textContent = item.mb;
          $("mb").href = MAP_URL;
        }

        function renderLanguageTrack() {
          const track = $("track");
          const langs = CHAT_LANGS.slice();
          const clone = langs.slice();
          track.innerHTML = "";
          [...langs, ...clone].forEach((lang) => {
            const span = el("span", "", lang);
            track.appendChild(span);
          });
        }

        function render() {
          const item = T[state.lang];
          document.documentElement.lang = item.lang;
          document.documentElement.dir = item.dir || "ltr";
          document.title = "UniBridge｜" + (state.lang === "zh" ? "文藻國際學生 AI 小幫手" : "Wenzao AI Helper");

          renderHeader();
          renderHero();
          renderFeatures();
          renderDemo();
          renderFaq();
          renderMap();
          renderLanguageTrack();
        }

        function initHelloLoop() {
          const chat = $("hchat");
          if (!chat) return;

          const tick = () => {
            const pair = HELLO[state.helloIndex % HELLO.length];
            chat.innerHTML = "";

            const me = el("div", "msg me", pair[1]);
            const small = el("small", "", pair[0]);
            me.prepend(small);
            chat.appendChild(me);

            setTimeout(() => {
              const bot = el("div", "msg bot", pair[2]);
              chat.appendChild(bot);
            }, 700);

            state.helloIndex += 1;
            state.helloTimer = setTimeout(tick, 2600);
          };

          tick();
        }

        function initRevealObserver() {
          const nodes = document.querySelectorAll(".rv");
          if (!nodes.length) return;
          const observer = new IntersectionObserver((entries, obs) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                entry.target.classList.add("in");
                obs.unobserve(entry.target);
              }
            });
          }, { threshold: 0.12 });

          nodes.forEach((node) => observer.observe(node));
        }

        function initScrollProgress() {
          const progress = document.createElement("div");
          progress.id = "progress-bar";
          Object.assign(progress.style, {
            position: "fixed",
            inset: "0 0 auto 0",
            height: "3px",
            background: "var(--line)",
            transformOrigin: "0 50%",
            transform: "scaleX(0)",
            zIndex: "30"
          });
          document.body.appendChild(progress);

          window.addEventListener("scroll", () => {
            const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
            const ratio = maxScroll > 0 ? window.scrollY / maxScroll : 0;
            progress.style.transform = "scaleX(" + ratio + ")";
          }, { passive: true });
        }

        function init() {
          initTheme();
          initLanguage();
          initCopyButton();
          render();
          initHelloLoop();
          initRevealObserver();
          initScrollProgress();
        }

        window.addEventListener("DOMContentLoaded", init);
      })();
    </script>
  </body>
</html>
